_format_version: "3.0"

services:
  - name: blog-app
    url: http://app:3000
    routes:
      - name: swagger-docs
        paths:
          - /api-docs
        methods:
          - GET
        strip_path: false
          
      - name: blog-users-api
        paths:
          - /api/users
        methods:
          - GET
          - POST
          - PUT
          - DELETE
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: request-transformer
            config:
              replace:
                uri: /users
      
      - name: blog-posts-api
        paths:
          - /api/posts  
        methods:
          - GET
          - POST
          - PUT
          - DELETE
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: request-transformer
            config:
              replace:
                uri: /posts

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Requested-With
        - apikey
      credentials: true
      max_age: 3600
  
  - name: rate-limiting
    config:
      minute: 100
      hour: 1000
      policy: local

consumers:
  - username: admin
    keyauth_credentials:
      - key: admin-key-123456

consumers:
  - username: blog-api-user
    keyauth_credentials:
      - key: BLOG-API-KEY-2025
